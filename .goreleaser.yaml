# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    flags:
      - -trimpath
    main: ./cmd/scopepro-exporter
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
